services:

  db:
    image: marketingos-postgres@sha256:83aa35133ffe747636050bc4ee14d49c9893f3f67e0de5d595ea021345f46b6f
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - marketingos_internal

  redis:
    image: docker.io/library/redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - marketingos_internal

  backend:
    image: marketingos-backend@sha256:5d5bb6f76d1ee159e38321f48c43aab9bb21b17752563a5d00a6c02dc61ff6c5
    pull_policy: never
    # v0.13H defense-in-depth
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,mode=1777"
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - marketingos_internal

  frontend:
    # v0.13H defense-in-depth
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,mode=1777"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    networks:
      - marketingos_internal

volumes:
  postgres_data:
  redis_data:

networks:
  marketingos_internal:
    driver: bridge
