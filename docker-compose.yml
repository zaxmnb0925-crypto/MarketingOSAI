services:

  db:
    image: ghcr.io/zaxmnb0925-crypto/marketingos-postgres:p5-r1-a3a891d-convergence-r3@sha256:ad8ac8367939421bcb94ccd45a6c43d73b15fb139760492e1f92efb19d8ce1fc
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - marketingos_internal

  redis:
    image: docker.io/library/redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - marketingos_internal

  backend:
    image: ghcr.io/zaxmnb0925-crypto/marketingos-backend:p5-r1-a3a891d-convergence-r3@sha256:79d225ffaa38f1495ec72709994116db1c0541fca8a09b2f479687b08674865e
    pull_policy: never
    # v0.13H defense-in-depth
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,mode=1777"
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - marketingos_internal

  frontend:
    # v0.13H defense-in-depth
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,mode=1777"
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    networks:
      - marketingos_internal

volumes:
  postgres_data:
  redis_data:

networks:
  marketingos_internal:
    driver: bridge
